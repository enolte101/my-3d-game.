<!DOCTYPE html>
<html>
<head>
    <title>Pure JS 3D Rocket Arena</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        canvas { background: #050510; border: 2px solid #333; }
        #ui { position: absolute; top: 20px; color: #00ffcc; font-size: 18px; font-weight: bold; text-shadow: 0 0 5px #000; }
    </style>
</head>
<body>
    <div id="ui">ROCKET ARENA: Use Arrow Keys to Drive & Turn</div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- GAME STATE ---
        let car = { x: 0, z: 0, angle: 0, speed: 0, width: 1.2, height: 0.8, length: 2 };
        let ball = { x: 0, z: 15, vx: 0, vz: 0, radius: 1, y: 0 };
        
        // Input tracking
        let keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // --- 3D ENGINE CORE (No Libraries) ---
        function project(x, y, z) {
            // Camera position tracking relative to the car (Third-Person View)
            let camDist = 6;
            let camHeight = 2.5;
            
            // Calculate camera position right behind the car
            let cx = car.x - Math.sin(car.angle) * camDist;
            let cz = car.z - Math.cos(car.angle) * camDist;
            let cy = camHeight;

            // Transform world coordinates relative to camera position
            let dx = x - cx;
            let dy = y - cy;
            let dz = z - cz;

            // Rotate world around camera based on car's direction
            let rx = dx * Math.cos(-car.angle) - dz * Math.sin(-car.angle);
            let rz = dx * Math.sin(-car.angle) + dz * Math.cos(-car.angle);

            // Clip points that are behind the camera lens
            if (rz <= 0.1) return null;

            // Perspective Projection Formula
            const fov = 500; 
            const screenX = (rx * fov) / rz + canvas.width / 2;
            const screenY = (-dy * fov) / rz + canvas.height / 2; // Invert Y for screen space
            return { x: screenX, y: screenY };
        }

        // --- WIREFRAME DRAWING HELPERS ---
        function draw3DLine(p1, p2, color, width = 1) {
            let proj1 = project(p1.x, p1.y, p1.z);
            let proj2 = project(p2.x, p2.y, p2.z);
            if (!proj1 || !proj2) return;

            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(proj1.x, proj1.y);
            ctx.lineTo(proj2.x, proj2.y);
            ctx.stroke();
        }

        function drawWireframeBox(cx, cy, cz, w, h, l, angle, color) {
            // Calculate 8 vertices of the box rotated around its own center
            let vertices = [];
            let cos = Math.cos(angle);
            let sin = Math.sin(angle);

            for (let dx of [-w/2, w/2]) {
                for (let dy of [-h/2, h/2]) {
                    for (let dz of [-l/2, l/2]) {
                        let rx = dx * cos - dz * sin;
                        let rz = dx * sin + dz * cos;
                        vertices.push({ x: cx + rx, y: cy + dy, z: cz + rz });
                    }
                }
            }

            // Fixed index mapping to securely draw all 12 structural edges
            const boxEdges = [, [1,3], [3,2], [2,0], // back, [5,7], [7,6], [6,4], // front, [1,5], [2,6], [3,7]  // links
            ];

            boxEdges.forEach(edge => {
                draw3DLine(vertices[edge[0]], vertices[edge[1]], color, 2);
            });
        }

        // --- GAME LOOP ---
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. CAR PHYSICS & CONTROLS
            if (keys['ArrowUp']) car.speed = Math.min(car.speed + 0.01, 0.2);
            else if (keys['ArrowDown']) car.speed = Math.max(car.speed - 0.01, -0.1);
            else car.speed *= 0.95; // Friction braking

            if (keys['ArrowLeft']) car.angle -= 0.04;
            if (keys['ArrowRight']) car.angle += 0.04;

            car.x += Math.sin(car.angle) * car.speed;
            car.z += Math.cos(car.angle) * car.speed;

            // 2. BALL PHYSICS & ARENA BOUNDS
            ball.x += ball.vx;
            ball.z += ball.vz;
            ball.vx *= 0.98; ball.vz *= 0.98; // Ball rolling resistance

            // Arena limits (Wall collisions)
            if (Math.abs(ball.x) > 25) { ball.vx *= -1; ball.x = Math.sign(ball.x) * 25; }
            if (Math.abs(ball.z) > 40) { ball.vz *= -1; ball.z = Math.sign(ball.z) * 40; }

            // 3. CAR TO BALL COLLISION DETECTION
            let dx = ball.x - car.x;
            let dz = ball.z - car.z;
            let distance = Math.sqrt(dx * dx + dz * dz);
            if (distance < ball.radius + car.length / 2) {
                // Bounce calculations based on hit angle and car velocity
                let hitAngle = Math.atan2(dx, dz);
                ball.vx = Math.sin(hitAngle) * (Math.abs(car.speed) + 0.1) * 1.5;
                ball.vz = Math.cos(hitAngle) * (Math.abs(car.speed) + 0.1) * 1.5;
            }

            // 4. RENDERING ENVIRONMENT
            // Draw Stadium Grid lines (Floor layout)
            for (let i = -25; i <= 25; i += 5) {
                draw3DLine({x: i, y: -0.4, z: -40}, {x: i, y: -0.4, z: 40}, "#222544");
            }
            for (let j = -40; j <= 40; j += 5) {
                draw3DLine({x: -25, y: -0.4, z: j}, {x: 25, y: -0.4, z: j}, "#222544");
            }
            // Draw Outer Boundary Arena Walls
            drawWireframeBox(0, 3, 0, 50, 7, 80, 0, "#ff0055"); 

            // 5. RENDERING OBJECTS
            // Draw Ball (Rendered cleanly as a structural 3D octahedron)
            let r = ball.radius;
            let bp = {x: ball.x, y: ball.y, z: ball.z};
            let bVerts = [
                {x: bp.x, y: bp.y+r, z: bp.z}, {x: bp.x, y: bp.y-r, z: bp.z},
                {x: bp.x+r, y: bp.y, z: bp.z}, {x: bp.x-r, y: bp.y, z: bp.z},
                {x: bp.x, y: bp.y, z: bp.z+r}, {x: bp.x, y: bp.y, z: bp.z-r}
            ];
            const bEdges = [[0,2],[0,3],[0,4],[0,5],[1,2],[1,3],[1,4],[1,5],[2,4],[4,3],[3,5],[5,2]];
            bEdges.forEach(e => draw3DLine(bVerts[e[0]], bVerts[e[1]], "#ffff00", 1.5));

            // Draw Your Car
            drawWireframeBox(car.x, 0, car.z, car.width, car.height, car.length, car.angle, "#00ffcc");

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
